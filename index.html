<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unstable TD Trade Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#07070b;
--panel:#111118;
--panel2:#181823;
--border:#2a2a38;
--text:#ffffff;
--accent:#7c4dff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Inter,sans-serif;
background:radial-gradient(circle at top,#141427 0%,#07070b 60%);
color:white;
min-height:100vh;
}

/* HEADER */
header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
background:rgba(10,10,18,0.8);
position:sticky;
top:0;
z-index:10;
}

.logo{font-size:22px;font-weight:800;}
.logo span{color:#7c4dff;}

input,select,button{
background:#181823;
border:1px solid #2a2a38;
color:white;
padding:10px;
border-radius:10px;
}

/* MAIN */
.main{
display:grid;
grid-template-columns:1fr 350px;
gap:15px;
padding:15px;
}

.panel{
background:#111118;
border:1px solid #2a2a38;
border-radius:18px;
padding:15px;
}

/* SLOT */
.slot{
height:110px;
background:#181823;
border:1px solid #2a2a38;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
position:relative;
transition:.2s;
}

.slot:hover{
transform:scale(1.03);
border-color:#7c4dff;
}

/* REMOVE HINT */
.slot small{
position:absolute;
bottom:5px;
font-size:10px;
color:#888;
}

/* UNIT CARD */
.unit{
padding:10px;
border-radius:12px;
background:#181823;
border:1px solid #2a2a38;
cursor:pointer;
transition:.2s;
margin-bottom:8px;
}

.unit:hover{
transform:translateY(-2px);
border-color:#7c4dff;
box-shadow:0 0 10px #7c4dff55;
}

/* ICON */
.unit img{
width:40px;
height:40px;
border-radius:8px;
}

/* FLEX UNIT */
.unit-top{
display:flex;
gap:10px;
align-items:center;
}

/* TAGS */
.tag{
font-size:11px;
padding:3px 8px;
border-radius:999px;
background:#222;
margin-right:4px;
}

/* ===================== */
/* RARITY GLOW EFFECTS   */
/* ===================== */

.Common{box-shadow:0 0 5px #666;}
.Legend{box-shadow:0 0 10px #4de1ff;}
.Arcane{box-shadow:0 0 10px #b84dff;}
.Mystic{box-shadow:0 0 15px #ff4df0;}
.Enchanted{box-shadow:0 0 15px #ffd24d;}
.Exclusive{box-shadow:0 0 15px #00ff88;}
.Elusive{box-shadow:0 0 20px #ff9d4d;}
.Transcendent{box-shadow:0 0 25px #ff4d4d;}

/* RESULT BAR */
.bar{
width:100%;
height:14px;
background:#222;
border-radius:999px;
overflow:hidden;
margin-top:10px;
}

.bar-fill{
height:100%;
width:50%;
background:linear-gradient(90deg,#00ff88,#ff5c5c);
transition:.3s;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
color:#888;
font-size:12px;
}

</style>
</head>

<body>

<header>
<div class="logo">💎 <span>Unstable TD</span> Trade Hub</div>

<div>
<input id="search" placeholder="Search">
<select id="sort">
<option value="high">High</option>
<option value="low">Low</option>
</select>
</div>
</header>

<div class="main">

<!-- TRADE -->
<div class="panel">

<h2>Your Trade</h2>
<div id="you" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>

<h2>Their Trade</h2>
<div id="them" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>

<!-- FAIRNESS BAR -->
<div style="margin-top:15px;">
<div id="resultText">Fair Trade</div>
<div class="bar">
<div class="bar-fill" id="bar"></div>
</div>
</div>

</div>

<!-- SIDEBAR -->
<div class="panel">
<h3>Units</h3>
<div id="list"></div>
</div>

</div>

<footer>
MADE BY SHAR
</footer>

<script>

/* SOUND */
const clickSound = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");
const removeSound = new Audio("https://www.soundjay.com/buttons/sounds/button-21.mp3");

/* DATA */
const units = [
{name:"Lawman",value:10,rarity:"Common",icon:"https://via.placeholder.com/40"},
{name:"Pirate",value:10,rarity:"Common",icon:"https://via.placeholder.com/40"},
{name:"Boosfer",value:20,rarity:"Legend",icon:"https://via.placeholder.com/40"},
{name:"Spoke",value:150,rarity:"Arcane",icon:"https://via.placeholder.com/40"},
{name:"Wifies",value:400,rarity:"Mystic",icon:"https://via.placeholder.com/40"},
{name:"Director",value:50000,rarity:"Elusive",icon:"https://via.placeholder.com/40"}
];

let selectedSlot=null;

/* CREATE SLOTS */
function create(id){
for(let i=0;i<6;i++){
let d=document.createElement("div");
d.className="slot";
d.innerHTML="+<small>double click to remove</small>";

d.onclick=()=>selectedSlot=d;

/* REMOVE ITEM */
d.ondblclick=()=>{
if(d.dataset.value){
removeSound.play();
d.innerHTML="+<small>double click to remove</small>";
d.dataset.value=0;
update();
}
};

document.getElementById(id).appendChild(d);
}
}
create("you");
create("them");

/* RENDER */
const list=document.getElementById("list");

function render(){
list.innerHTML="";
units.forEach(u=>{
let d=document.createElement("div");
d.className="unit "+u.rarity;

d.innerHTML=`
<div class="unit-top">
<img src="${u.icon}">
<div>
<b>${u.name}</b><br>
<small>${u.value}</small>
</div>
</div>
`;

d.onclick=()=>{
if(!selectedSlot)return;
clickSound.play();

selectedSlot.innerHTML=`
<div>
<img src="${u.icon}"><br>
<b>${u.name}</b>
</div>
<small>double click to remove</small>
`;

selectedSlot.dataset.value=u.value;
update();
};

list.appendChild(d);
});
}
render();

/* CALC */
function total(id){
let sum=0;
document.querySelectorAll(`#${id} .slot`).forEach(s=>{
sum+=Number(s.dataset.value||0);
});
return sum;
}

/* UPDATE TRADE + BAR */
function update(){
let a=total("you");
let b=total("them");

let diff=a-b;
let percent=50+(diff/(b+1))*10;
percent=Math.max(0,Math.min(100,percent));

document.getElementById("bar").style.width=percent+"%";

let text="🤝 Fair Trade";
if(percent>60)text="📈 You Win";
if(percent<40)text="📉 You Lose";

document.getElementById("resultText").innerText=`${text} (${a} vs ${b})`;
}

/* SEARCH */
document.getElementById("search").oninput=render;

</script>

</body>
</html>
